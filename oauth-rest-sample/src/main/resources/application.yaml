logging:
  level:
    root: INFO
    org.springframework.security: TRACE
    org.springframework.security.oauth2: TRACE
    org.springframework.security.oauth2.jwt: TRACE
    com.nimbusds: TRACE

spring:
  application:
    name: oauth-rest-sample
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://gqt2q2.logto.app/oidc
          jwk-set-uri: https://gqt2q2.logto.app/oidc/jwks
          audiences: https://springrest-sample-api
          algorithm: ES384

jwt:
  signature-verification:
    enabled: false  # Set to true for production

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/oauth-rest-sample}
